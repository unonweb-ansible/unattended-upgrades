---
# APT
# ===
unattended_upgrades_install_apt_state: present
unattended_upgrades_install_apt:
- apt-listchanges
- unattended-upgrades
- needrestart
- powermgmt-base

# CONFIG
# ======
unattended_upgrades_config_template:
unattended_upgrades_config_dst: /etc/apt/apt.conf.d/50unattended-upgrades
unattended_upgrades_config_vars: {}
unattended_upgrades_config_defaults:
  # periodic
  periodic_enable: 1
  periodic_update_package_lists: 1
  periodic_download_upgradeable_packages: 1
  periodic_upgrade: 1
  periodic_autoclean_interval: 21
  periodic_verbose: 2
  # origins
  allowed_origins:
  - "Debian:stable-security"
  - "Debian:stable-updates"
  # blacklist
  package_blacklist: []
  # notify
  mail:
  sender: "{{ inventory_hostname }}"
  mail_report: on-change
  # behaviour
  autofix_interrupted_dpkg: true
  minimal_steps: true
  # cleanup
  remove_unused_kernel_packages: true
  remove_new_unused_dependencies: true
  remove_unused_dependencies: true
  # system
  automatic_reboot: false
  syslog_enable: false
  only_on_ac_power: false


# SYSTEMD
# =======
unattended_upgrades_systemd_scope: system
unattended_upgrades_systemd_copy: []
unattended_upgrades_systemd_template: []
unattended_upgrades_systemd_reset: []
unattended_upgrades_systemd_overrides: []
unattended_upgrades_systemd_start: []
unattended_upgrades_systemd_stop: []
unattended_upgrades_systemd_enable: []
unattended_upgrades_systemd_disable: []
# apt-daily-upgrade.service
# apt-daily-upgrade.timer
# apt-daily.service
# apt-daily.timer

# LISTCHANGES
# ===========
unattended_upgrades_listchanges_config: listchanges.conf.j2
